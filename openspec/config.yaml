schema: spec-driven

# Project context, shown to the AI when it creates artifacts.
context: |
  Project: mail_informer. Polls several mail accounts (Gmail and IMAP, for example Strato)
  every 5 minutes and archives new mails
  (metadata + plain-text body) in Postgres. An analyzer rates them with an LLM through an
  OpenAI-compatible API (local Ollama by default; a remote server only with an explicit setting).

  Tech stack: Python 3.12, psycopg 3, Gmail API (google-api-python-client), imaplib,
  Postgres 16, Docker Compose, supercronic, pytest.

  Architecture (keep these layers separate):
  - gmail.py: Gmail API access only. No database code.
  - imap.py: IMAP access only (read-only, INBOX). No database code.
  - accounts.py: loads and checks the accounts file. No other I/O.
  - parsing.py: pure functions, no I/O.
  - db.py: all SQL. No business logic.
  - sync.py: orchestration. Depends on the MailSource protocol, not on concrete clients.
  - cli.py: entry point and wiring only.

  Domain rules:
  - Gmail access is read-only (scope gmail.readonly). Never request wider scopes.
  - IMAP access is read-only too: read-only SELECT, BODY.PEEK, no flags, no deletes.
    Passwords come only from the accounts file and never reach logs or the database.
  - Writes must be idempotent (ON CONFLICT DO NOTHING). A run can be repeated safely.
  - The sync cursor of an account advances only after the mails up to it are stored.
  - Schema changes are new numbered files in mail_informer/migrations/. Never edit
    an applied migration.
  - Never log or commit secrets, tokens, or mail content.

  Conventions:
  - Language: simple technical English for code, comments, docstrings, specs,
    commit messages, and logs. Short sentences. No jargon where a plain word works.
  - Docstrings: Google style (Args, Returns, Raises). Public functions and classes
    only. Do not repeat what the type hints already say.
  - Comments explain why, not what.
  - Type hints on all function signatures.
  - Commits: conventional commits (feat:, fix:, test:, docs:, chore:, refactor:).
  - Branches: one branch per change, created from main. Name it issue-<number>-<short-name>
    (for example issue-142-analyzer-timeout); a "<user>/" prefix added by Orca is accepted.
    Never commit directly to main.
  - Dependencies: pinned in constraints.txt. Add a new dependency only with a reason.
  - Config comes from environment variables (12-factor). Fail early if a required
    value is missing.
  - The container runs as a non-root user.

# Style rules added by the agent-workflow plugin (apply on top of the context above).
context_addition: |
  Style: write simple technical English with short sentences and no filler.
  Keep artifacts short; every sentence must carry a decision, a requirement, or
  a fact someone needs later. Agent reports are at most 5 lines.

# Per-artifact rules
rules:
  proposal:
    - Keep it short. State the problem, the change, and the impact.
    - Include a "Non-goals" section.
    - Write in simple technical English.
    - 'Reference the GitHub issue this change addresses (e.g. "Closes #1") in the
      Why or Impact section. Keep the proposal under one page.'
  specs:
    - Use SHALL/MUST for requirements. Every requirement needs at least one scenario.
    - Write scenarios as WHEN / THEN. Each one must be testable by one automated test,
      or name the manual check that verifies it.
    - Describe behavior, not implementation.
    - Write in simple technical English.
  design:
    - Explain decisions and the alternatives that were rejected, with reasons.
    - Name risks and failure modes (crash mid-run, API errors, duplicate runs).
    - State what happens to existing data (migration, rollback).
    - Write in simple technical English.
    - 'Keep design.md short: one entry per real decision (choice, reason,
      rejected alternative, at most 5 lines). Do not restate the specs or the issue.'
    - 'Whenever a change involves an architecture decision, create an ADR first
      (Status, Context, Decision, Consequences). Its status must be "Accepted"
      before the decision is implemented, and the architecture docs must be updated.'
  tasks:
    - Follow red-green-refactor. For each behavior, one task writes the failing test
      (red), the next makes it pass (green), then clean up (refactor).
    - Put the test task before the implementation task. Never the other way round.
    - Keep each task small enough to finish in about 2 hours or less.
    - 'Every scenario in the delta specs is covered by a task that names the
      scenario. Write one task per behavior ("test, then code"), not separate
      RED and GREEN tasks.'
    - Group tasks so that each numbered group can be committed on its own.
    - A task that needs Docker, a server, or another external tool says so, so the
      coordinator can check it before apply starts.
    - 'The last group is "Verification" and contains a task that runs the check
      command (make check) plus any manual checks the specs name.'

# Per-operation guidance
operations:
  apply:
    guidance:
      - Before the first edit, create the branch issue-<number>-<short-name> from an
        up-to-date main (a "<user>/" prefix added by Orca is accepted). Reuse it if it
        already exists.
      - Work test-first. Write one failing test, run it, and confirm it fails for the
        right reason before writing any implementation (red).
      - Write the smallest code that makes the test pass (green). Run the tests again.
      - Refactor only while all tests are green. Do not mix refactoring with new behavior.
      - Do not change behavior without a matching spec and test.
      - Before marking a task done, run the full test suite and show the result.
        Tests that need Postgres run with TEST_DATABASE_URL.
      - Keep changes inside the scope of the current change. Note unrelated problems
        instead of fixing them.
      - Use Google-style docstrings and simple technical English in all new code.
      - Tick a task only after the test or command that proves it has passed in this
        session; never tick a task based on an assumption.
      - 'Tests must be deterministic: never compare two clock reads for equality and
        never rely on sleeps for ordering; set the time explicitly instead.'
      - 'Commit after each completed task group with a Conventional Commits message
        (feat:, fix:, test:, docs:, chore:).'
      - Do the Docker or container checks named in the tasks yourself; do not leave
        them for a later phase.
      - Apply is finished only when the check command (make check) passes twice in a row.
  archive:
    guidance:
      - Check that all tasks are done and the test suite is green before archiving.
      - Make sure all work is committed on the change branch, ready to merge into main.
      - Archive on the change branch, before the pull request is merged.
      - Sync delta specs into the main specs.
      - 'If the change has a review.md, every finding with "Decision: fix" must have
        "Status: fixed"; otherwise stop and report the open findings instead of archiving.'
      - Summarize the outcome in a few plain sentences.
