name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mail_informer
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mail_informer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mail_informer" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mail_informer:test@127.0.0.1:5432/mail_informer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: python -m pytest -q
