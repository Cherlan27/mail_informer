services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mail_informer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mail_informer
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail_informer"]
      interval: 5s
      timeout: 3s
      retries: 10

  poller:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mail_informer:${POSTGRES_PASSWORD}@postgres:5432/mail_informer
      TOKEN_PATH: /secrets/token.json
    volumes:
      - ./secrets:/secrets
    healthcheck:
      test: ["CMD", "python", "-m", "mail_informer", "health"]
      interval: 5m
      timeout: 20s
      retries: 1
      start_period: 2m

  analyzer:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mail_informer:${POSTGRES_PASSWORD}@postgres:5432/mail_informer
      RUN_COMMAND: analyze
      CRONTAB: /app/crontab.analyzer
      ANALYZER_MODEL: ${ANALYZER_MODEL:?set ANALYZER_MODEL in .env}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    # The model server runs on the host. This also makes the name work on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No secrets volume: the analyzer has no Gmail token and cannot reach the mailbox.
    healthcheck:
      test: ["CMD", "python", "-m", "mail_informer", "analyzer-health"]
      interval: 5m
      timeout: 20s
      retries: 1
      start_period: 2m

volumes:
  pgdata:
